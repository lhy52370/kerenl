name: Build Kernel

on:
  # 保留手动触发按钮
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'alioth' # 帮你把默认改成了红米K40
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: false
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both

  # 新增：当你推送代码到这个分支时，自动触发编译（按钮不消失，且支持自动编译）
  push:
    branches:
      - lineage-24.0
      - main

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device || 'alioth' }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device || 'alioth' }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device || 'alioth' }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    # ==================== 新增配置与合并步骤开始 ====================
    - name: Auto Download & Run setup.sh
      run: |
        echo "下载 BakaSU setup.sh ..."
        curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" -o setup.sh
        chmod +x setup.sh
        echo "Executing: ./setup.sh"
        ./setup.sh

    - name: Auto Apply BakaSU Manual Hook
      run: |
        echo "开始自动应用 BakaSU Manual Hook..."
        if [ ! -f "Makefile" ] || [ ! -d "fs" ]; then
          echo "警告：未找到内核源码根目录，跳过 Manual Hook 自动挂钩。"
          exit 0
        fi

        # 1. 在 fs/exec.c 中插入 execveat hook
        EXEC_C="fs/exec.c"
        if [ -f "$EXEC_C" ]; then
          if ! grep -q "ksu_handle_execveat" "$EXEC_C"; then
            echo "在 fs/exec.c 中注入 execveat hook..."
            python3 - "$EXEC_C" <<'PY'
        import sys, re
        path = sys.argv[1]
        with open(path, "r", encoding="utf-8", errors="ignore") as f:
            src = f.read()

        hook = r'''
#ifdef CONFIG_KSU_MANUAL_HOOK
	extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
				       void *envp, int *flags);
	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
#endif
'''
        pattern = r'(static int do_execveat_common\([^)]*\)\s*\{)'
        if re.search(pattern, src) and "ksu_handle_execveat" not in src:
            src = re.sub(pattern, r'\1' + hook, src, count=1)
            with open(path, "w", encoding="utf-8") as f:
                f.write(src)
            print("fs/exec.c 已注入 hook。")
        else:
            print("未匹配到 do_execveat_common 或已存在 hook，跳过。")
PY
          else
            echo "fs/exec.c 中已存在 ksu_handle_execveat，跳过。"
          fi
        fi

        # 2. 在 fs/open.c 中插入 stat hook
        OPEN_C="fs/open.c"
        if [ -f "$OPEN_C" ]; then
          if ! grep -q "ksu_handle_stat" "$OPEN_C"; then
            echo "在 fs/open.c 中注入 stat hook..."
            python3 - "$OPEN_C" <<'PY'
        import sys, re
        path = sys.argv[1]
        with open(path, "r", encoding="utf-8", errors="ignore") as f:
            src = f.read()

        hook = r'''
#ifdef CONFIG_KSU_MANUAL_HOOK
	extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
	ksu_handle_stat(&dfd, &filename, &flags);
#endif
'''
        pattern = r'(int vfs_statx\([^)]*\)\s*\{)'
        if re.search(pattern, src) and "ksu_handle_stat" not in src:
            src = re.sub(pattern, r'\1' + hook, src, count=1)
            with open(path, "w", encoding="utf-8") as f:
                f.write(src)
            print("fs/open.c 已注入 hook。")
        else:
            print("未匹配到 vfs_statx 或已存在 hook，跳过。")
PY
          else
            echo "fs/open.c 中已存在 ksu_handle_stat，跳过。"
          fi
        fi
        echo "BakaSU Manual Hook 自动挂钩完成。"

    - name: Auto Patch & Merge Config
      run: |
        echo "自动查找配置碎片，追加 KSU 配置并合并..."
        
        # 1. 精准定位设备碎片配置 (alioth.config)
        FRAG_CONFIG=$(find arch/arm64/configs -path "*vendor/xiaomi/alioth.config" 2>/dev/null | head -n 1)
        if [ -z "$FRAG_CONFIG" ]; then
          FRAG_CONFIG=$(find arch/arm64/configs -name "alioth.config" 2>/dev/null | head -n 1)
        fi

        # 2. 精准定位公共平台碎片配置 (sm8250-common.config)
        COMMON_FRAG=$(find arch/arm64/configs -path "*vendor/xiaomi/sm8250-common.config" 2>/dev/null | head -n 1)

        # 3. 寻找基础 defconfig
        BASE_CONFIG=$(find arch/arm64/configs -name "*alioth*defconfig" 2>/dev/null | head -n 1)

        if [ -n "$FRAG_CONFIG" ]; then
          echo "找到设备碎片配置: $FRAG_CONFIG"
          # 将 KSU 配置追加到设备碎片中
          grep -q "^CONFIG_KSU=y" "$FRAG_CONFIG" || echo "CONFIG_KSU=y" >> "$FRAG_CONFIG"
          grep -q "^CONFIG_KSU_MANUAL_HOOK=y" "$FRAG_CONFIG" || echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$FRAG_CONFIG"
          echo "已向 $FRAG_CONFIG 追加 CONFIG_KSU=y 和 CONFIG_KSU_MANUAL_HOOK=y。"

          # 准备合并
          if [ -f "scripts/kconfig/merge_config.sh" ]; then
            echo "开始调用 merge_config.sh 合并碎片..."
            
            # 构建合并命令
            MERGE_CMD="./scripts/kconfig/merge_config.sh -m"
            if [ -n "$BASE_CONFIG" ]; then
              MERGE_CMD="$MERGE_CMD $BASE_CONFIG"
              echo "包含基础配置: $BASE_CONFIG"
            fi
            if [ -n "$COMMON_FRAG" ]; then
              MERGE_CMD="$MERGE_CMD $COMMON_FRAG"
              echo "包含平台公共配置: $COMMON_FRAG"
            fi
            MERGE_CMD="$MERGE_CMD $FRAG_CONFIG"
            
            # 执行合并生成 .config
            eval "$MERGE_CMD"
            echo "配置碎片合并完成！"
          else
            echo "警告：未找到 merge_config.sh，跳过强制合并（build_kernel.sh 内部会处理）。"
          fi
        else
          echo "警告：未找到 alioth.config，跳过配置追加与合并。"
        fi
    # ==================== 新增配置与合并步骤结束 ====================

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        
        # 兼容：如果是手动触发，用 inputs；如果是 push 触发，默认用 alioth 和 both
        DEVICE="${{ github.event.inputs.device || 'alioth' }}"
        TARGET_OS="${{ github.event.inputs.target_os || 'both' }}"
        
        ARGS="$DEVICE"
        
        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi
        
        if [ "$TARGET_OS" != "both" ]; then
          ARGS="$ARGS $TARGET_OS"
        fi
        
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ github.event.inputs.device || 'alioth' }}-${{ github.event.inputs.target_os || 'both' }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0 # 已经被 zip 压缩过，无需再二次压缩。看这一个 YML他都在干什么？
